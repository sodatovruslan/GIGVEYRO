# ============================================================
# GIGVEYRO — Production-like Docker Compose
# Services: postgres · redis · backend · frontend · worker
#
# Usage:
#   cp GIGVEYRO_Backend/.env.example GIGVEYRO_Backend/.env
#   # edit .env with your values
#   docker compose up --build
# ============================================================

name: gigveyro

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gigveyro}
      POSTGRES_USER: ${POSTGRES_USER:-gigveyro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gigveyro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gigveyro_user} -d ${POSTGRES_DB:-gigveyro}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Do NOT expose port 5432 publicly in production.
    # expose: ["5432"]

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistence: AOF + RDB snapshot for durability
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - gigveyro-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Do NOT expose port 6379 publicly in production.
    # expose: ["6379"]

  # One-shot migration gate. Run only after the documented backup/precheck.
  migrate:
    image: gigveyro-backend:local
    build:
      context: ./GIGVEYRO_Backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - ${BACKEND_ENV_FILE:-./GIGVEYRO_Backend/.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gigveyro_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gigveyro}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "false"
      PAYOUT_ENABLED: "false"
      PAYOUT_PROVIDER_MODE: disabled
      PAYOUT_SIMULATION_ENABLED: "false"
      BYBIT_WRITE_ENABLED: "false"
    networks:
      - gigveyro-net
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    image: gigveyro-backend:local
    build:
      context: ./GIGVEYRO_Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./GIGVEYRO_Backend/.env.production}
    environment:
      # Override DATABASE_URL and REDIS_URL to use internal service names
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gigveyro_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gigveyro}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "false"
      PAYOUT_ENABLED: "false"
      PAYOUT_PROVIDER_MODE: disabled
      PAYOUT_SIMULATION_ENABLED: "false"
      BYBIT_WRITE_ENABLED: "false"
      REALTIME_BROKER: redis
      RATE_LIMIT_FAIL_MODE: closed
      FORWARDED_ALLOW_IPS: 172.30.0.10
    expose:
      - "8000"
    networks:
      - gigveyro-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "
        echo 'Starting backend...' &&
        uvicorn app.main:app
          --host 0.0.0.0
          --port 8000
          --workers $${WEB_CONCURRENCY:-1}
          --proxy-headers
          --forwarded-allow-ips $${FORWARDED_ALLOW_IPS:-127.0.0.1}
          --log-level $${LOG_LEVEL:-info}
          --no-access-log
      "

  # ── Background Worker (ARQ) ──────────────────────────────────
  worker:
    image: gigveyro-backend:local
    build:
      context: ./GIGVEYRO_Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./GIGVEYRO_Backend/.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gigveyro_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gigveyro}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "false"
      PAYOUT_ENABLED: "false"
      PAYOUT_PROVIDER_MODE: disabled
      PAYOUT_SIMULATION_ENABLED: "false"
      BYBIT_WRITE_ENABLED: "false"
      REALTIME_BROKER: redis
      RATE_LIMIT_FAIL_MODE: closed
    networks:
      - gigveyro-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Starting ARQ worker...' &&
        python worker_entrypoint.py
      "

  # ── Frontend (Next.js) ───────────────────────────────────────
  frontend:
    build:
      context: ./gigveyro-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server-side BFF connection. Browser API calls remain same-origin.
      BACKEND_API_URL: http://backend:8000
    expose:
      - "3000"
    networks:
      - gigveyro-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      gigveyro-net:
        ipv4_address: 172.30.0.10
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gigveyro-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
