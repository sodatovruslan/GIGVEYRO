# ============================================================
# GIGVEYRO — Production TLS overlay
#
# Layered on top of docker-compose.yml on the live server:
#   docker compose -f docker-compose.yml -f docker-compose.prod-tls.yml up -d
#
# nginx/certs holds the Let's Encrypt cert for gigapay.uno (gitignored -
# never commit private key material). nginx/acme-challenge is the
# webroot certbot writes HTTP-01 challenge tokens into for zero-downtime
# renewal; nginx serves it back out via the acme-challenge location in
# nginx/nginx.conf. Both directories only exist on the server.
# ============================================================

name: gigveyro
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/acme-challenge:/var/www/acme-challenge:ro
