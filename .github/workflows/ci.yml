name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gigveyro_test
          POSTGRES_USER: gigveyro_test
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gigveyro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: GIGVEYRO_Backend

    env:
      DATABASE_URL: postgresql+asyncpg://gigveyro_test:test_password@localhost:5432/gigveyro_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
      TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      APP_ENV: test
      PAYOUT_ENABLED: "false"
      DEPOSIT_PROVIDER_TYPE: mock
      EXCHANGE_RATE_PROVIDER_TYPE: fallback
      PAYOUT_PROVIDER_TYPE: mock
      DOCS_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: GIGVEYRO_Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Verify single Alembic head
        run: test "$(alembic heads | grep -c '(head)')" -eq 1

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln GHSA-2jv5-9r88-3w3p || true
        continue-on-error: true  # Don't block CI on advisory warnings

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gigveyro-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gigveyro-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true  # Advisory, not blocking

  # ── Browser E2E ──────────────────────────────────────────────
  e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gigveyro_e2e_base
          POSTGRES_USER: gigveyro_e2e
          POSTGRES_PASSWORD: e2e_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gigveyro_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://gigveyro_e2e:e2e_password@localhost:5432/gigveyro_e2e_base
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: GIGVEYRO_Backend/requirements.txt

      - name: Install backend dependencies
        working-directory: GIGVEYRO_Backend
        run: pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gigveyro-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: gigveyro-frontend
        run: npm ci

      - name: Install Chromium
        working-directory: gigveyro-frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: gigveyro-frontend
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: gigveyro-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ── Docker build verification ─────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --file GIGVEYRO_Backend/Dockerfile \
            --tag gigveyro-backend:ci \
            GIGVEYRO_Backend/

      - name: Build frontend image
        run: |
          docker build \
            --file gigveyro-frontend/Dockerfile \
            --tag gigveyro-frontend:ci \
            gigveyro-frontend/

      - name: Validate docker-compose config
        run: docker compose config --quiet
