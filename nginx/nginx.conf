# ============================================================
# GIGVEYRO — Nginx Reverse Proxy Configuration
#
# Routes:
#   /api/        → FastAPI backend (port 8000)
#   /ws/         → FastAPI WebSocket (port 8000) with upgrade headers
#   /health      → FastAPI backend (port 8000)
#   /metrics     → FastAPI backend (internal only — restrict in prod)
#   /            → Next.js frontend (port 3000)
#
# TLS termination: handled at Nginx level (certificates not included)
# Set DOMAIN environment variable and point ssl_certificate paths.
#
# IMPORTANT: This is a TEMPLATE. Adjust server_name, SSL paths,
# and upstream addresses for your deployment.
# ============================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect (uncomment in production with TLS) ──
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;  # Uncomment for TLS
    server_name _;

    # TLS certificates — uncomment and configure for production
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;

    # Security headers (complement FastAPI SecurityHeadersMiddleware)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Proxy common headers — passed to all upstreams
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # Client body size limit
    client_max_body_size 10m;

    # Default proxy timeouts
    proxy_connect_timeout  30s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # ── API routes → Backend ──────────────────────────────────
    location /api/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # Keep-alive for upstream
    }

    # ── WebSocket → Backend (Codex realtime) ─────────────────
    # CRITICAL: WebSocket upgrade headers must be set correctly.
    location /api/v1/ws {
        proxy_pass http://backend/api/v1/ws;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Extended timeout for persistent WebSocket connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ── Health checks → Backend ───────────────────────────────
    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;  # Don't fill logs with health checks
    }

    # ── Metrics → Backend (RESTRICT IN PRODUCTION) ────────────
    # In production, restrict /metrics to internal network only:
    #   allow 10.0.0.0/8;
    #   deny all;
    location /metrics {
        proxy_pass http://backend/metrics;
        proxy_http_version 1.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ── Frontend → Next.js ────────────────────────────────────
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

    }

    # ── Error pages ───────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
