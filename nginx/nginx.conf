# ============================================================
# GIGVEYRO — Nginx Reverse Proxy Configuration (production)
#
# Deployed at gigapay.uno (171.22.174.158). This is the exact config
# running on the server (synced back here for disaster recovery — the
# live copy at /opt/gigapay/nginx/nginx.conf is authoritative day to
# day; update both together).
#
# Routes:
#   /api/             → FastAPI backend (port 8000)
#   /api/v1/ws        → FastAPI WebSocket (port 8000) with upgrade headers
#   /telegram/webhook → FastAPI backend (port 8000) - public Telegram Bot API callback
#   /health           → FastAPI backend (port 8000)
#   /metrics          → FastAPI backend (internal only)
#   /                 → Next.js frontend (port 3000)
#
# TLS: Let's Encrypt via certbot webroot (see docker-compose.prod-tls.yml
# for the acme-challenge volume mount and nginx/certs mount). Renewal is
# zero-downtime — certbot's deploy-hook on the server copies the renewed
# cert into nginx/certs and reloads the nginx container automatically.
# ============================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ACME HTTP-01 challenge path for certbot renewal - must stay
    # reachable over plain HTTP even though everything else redirects.
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/acme-challenge/.well-known/acme-challenge/;
    }

    location /health/live {
        proxy_pass http://backend/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # NOTE: nginx's proxy_set_header inheritance is all-or-nothing per
    # location - a location that sets even one proxy_set_header of its own
    # (e.g. Connection, for the Upgrade/keep-alive handling below) stops
    # inheriting every proxy_set_header set above at the server level,
    # including Host/X-Real-IP/X-Forwarded-For/X-Forwarded-Proto. Every
    # location below sets Connection, so each repeats the four headers
    # explicitly instead of silently losing them.

    client_max_body_size 10m;
    proxy_connect_timeout  30s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    location /api/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/v1/ws {
        proxy_pass http://backend/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    location /telegram/webhook {
        proxy_pass http://backend/telegram/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location /metrics {
        proxy_pass http://backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
